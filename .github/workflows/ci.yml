name: Build & visual tests

# Everything this plugin does happens on the GPU, so a "build" is: import the
# project (parses every GDScript, compiles every shader), then actually RENDER a
# test level on the Mobile renderer and keep the screenshots as artifacts. It
# runs on Mesa's software Vulkan (lavapipe) under Xvfb, so no GPU and no phone
# are needed - and every pull request has to attach its own evidence (see
# CONTRIBUTING.md).

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.7.2"
  GODOT_BIN: godot
  # Mesa's software Vulkan implementation: a real Vulkan 1.3 device, so the
  # Mobile renderer and GoyGI's compute shaders run exactly like on a phone.
  VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
  GODOT_SILENCE_ROOT_WARNING: "1"

jobs:
  build-and-render:
    name: Import, render, measure
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan (lavapipe), Xvfb and Godot's X dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            wget unzip xvfb libvulkan1 mesa-vulkan-drivers vulkan-tools \
            libx11-6 libxcursor1 libxinerama1 libxrandr2 libxi6 libxext6 \
            libasound2 libfontconfig1 libgl1
          vulkaninfo --summary | head -40 || true

      - name: Download Godot ${{ env.GODOT_VERSION }}
        run: |
          set -eux
          url="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          wget -q "$url" -O /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          sudo mv "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Import the project (parses every GDScript, compiles every shader)
        # NOT --headless: building an RDShaderFile needs a RenderingDevice, so the
        # import has to run with real Vulkan (lavapipe) under Xvfb. In headless
        # mode Godot refuses ("Cannot import custom .glsl shaders when running in
        # headless mode") and the GI shaders would be missing at runtime.
        run: |
          set -o pipefail
          # the first import can exit non-zero while it keeps working; run it twice
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --import --rendering-driver vulkan 2>&1 | tee import.log || true
          timeout 420 xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --import --rendering-driver vulkan 2>&1 | tee -a import.log || true
          echo "---- script / shader errors ----"
          grep -nE "SCRIPT ERROR|Parse Error|Compile Error|COMPILATION ERROR" import.log || echo "none"
          echo "---- imported artefacts ----"
          ls .godot/imported 2>/dev/null | head -20 || echo "nothing imported"

      - name: Render the visual test on the Mobile renderer
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1280x720x24" \
            godot --path . --rendering-method mobile --rendering-driver vulkan \
                  --resolution 1280x720 --verbose 2>&1 | tee render.log
          echo "exit=${PIPESTATUS[0]}" | tee -a render.log

      - name: Summarise the results
        if: always()
        run: |
          echo "## GoyGI visual test" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/summary.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "no summary produced" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          if grep -qE "SCRIPT ERROR|Parse Error|compute shader error|shader compilation failed|GoyGI test: FAILED" render.log; then
            echo "### Result: FAILED" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### Result: OK" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Fail on script / shader / GI errors
        run: |
          status=0
          if grep -nE "SCRIPT ERROR|Parse Error|Compile Error|compute shader error|Shader compilation failed|ERROR: .*gi_(volume|direct|blend|meter)" render.log import.log; then
            echo "::error::errors found in the render log (see above)"
            status=1
          fi
          if grep -q "GoyGI test: FAILED" render.log; then
            echo "::error::the visual test reported failing checks"
            status=1
          fi
          if grep -q "GIManager: no RenderingDevice" render.log; then
            echo "::error::no RenderingDevice: GoyGI never started (software Vulkan missing?)"
            status=1
          fi
          if ! ls artifacts/*.png >/dev/null 2>&1; then
            echo "::error::no screenshots were produced"
            status=1
          fi
          exit $status

      - name: Upload screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: goygi-visual-${{ github.sha }}
          path: |
            artifacts/
            render.log
            import.log
          if-no-files-found: warn
          retention-days: 30
